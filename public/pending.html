<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0612">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FileShare - Aguardando Aprovação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261008d">
  <script src="/js/common.js?v=20261007a"></script>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/js/mobile.js" defer></script>
  <link rel="stylesheet" href="/css/fx.css">
  <link rel="stylesheet" href="/css/adaptive.css">
  <script src="/js/fx.js" defer></script>
</head>
<body class="auth-page">
  <canvas id="cyberRain" aria-hidden="true"></canvas>
  <div class="cy-grid" aria-hidden="true"></div>
  <div class="cy-scan" aria-hidden="true"></div>
  <div class="auth-container">
    <div class="auth-card" style="text-align:center;">
      <div class="pending-icon"><i class="fas fa-hourglass-half"></i></div>
      <h1 class="glitch" data-text="AGUARDANDO" style="font-size:24px;margin:14px 0 14px;">AGUARDANDO</h1>
      <p class="cy-lead">
        Sua conta foi criada com sucesso!<br>
        O administrador precisa aprovar seu acesso antes que você possa usar o sistema.
      </p>
      <p class="cy-status" style="margin:0 0 20px;"><span id="cyType" data-text="> verificando aprovação a cada 2s"></span><span class="cy-caret"></span></p>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn btn-outline" onclick="checkStatus()"><i class="fas fa-sync-alt"></i> Verificar Status</button>
        <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>
      <div id="statusMsg" class="alert" style="display:none;margin-top:16px;"></div>
    </div>
  </div>
  <script src="/js/cyber.js"></script>
  <script>
    async function checkStatus() {
      const msg = document.getElementById('statusMsg');
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (data.status === 'approved') {
          msg.className = 'alert alert-success';
          msg.innerHTML = '<i class="fas fa-check-circle"></i> Sua conta foi aprovada! Redirecionando...';
          msg.style.display = 'block';
          clearInterval(statusTimer);
          setTimeout(() => window.location.href = '/dashboard', 1500);
        } else {
          msg.className = 'alert alert-warning';
          msg.innerHTML = '<i class="fas fa-clock"></i> Ainda aguardando aprovação...';
          msg.style.display = 'block';
        }
      } catch(e) {
        msg.className = 'alert alert-error';
        msg.textContent = 'Erro ao verificar';
        msg.style.display = 'block';
      }
    }
    let statusTimer = setInterval(() => { if (!document.hidden) checkStatus(); }, 2000);
    checkStatus();
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    }
  </script>
  <script src="/js/cursor.js"></script>
  <script src="/js/announce.js"></script>
</body>
</html>
