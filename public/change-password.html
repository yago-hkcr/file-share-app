<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <title>Atualize sua senha - Arquive Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css?v=20261014a">
  <link rel="stylesheet" href="/css/style.css?v=20261014a">
  <script src="/js/common.js?v=20261014a"></script><script src="/js/adaptive.js?v=20261014a"></script>
  <link rel="stylesheet" href="/css/mobile.css?v=20261014a">
  <script src="/js/mobile.js?v=20261014a" defer></script>
  <link rel="stylesheet" href="/css/fx.css?v=20261014a">
  <link rel="stylesheet" href="/css/adaptive.css?v=20261014b">
  <script src="/js/gfx.js?v=20261014p"></script><script src="/js/fx.js?v=20261014a" defer></script>
  <link rel="stylesheet" href="/css/mobile-scroll-fix.css?v=20261014a">
  <link rel="stylesheet" href="/css/auth-flow.css?v=20261014a">
  <link rel="stylesheet" href="/css/hacker-ui.css?v=20261014a">
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card" aria-labelledby="passwordHeading">
      <button type="button" class="btn btn-sm auth-settings-btn" id="authSettingsBtn" aria-label="Configurações de desempenho" title="Configurações de desempenho"><i class="fas fa-cog" aria-hidden="true"></i></button>
      <header class="auth-header">
        <div class="auth-icon" aria-hidden="true">FS</div>
        <h1 id="passwordHeading">Proteja sua conta</h1>
        <p>Para continuar, atualize sua senha. Ela precisa ter pelo menos 4 caracteres.</p>
      </header>
      <form id="passwordUpdateForm">
        <div class="form-group">
          <label for="currentPassword">Senha atual</label>
          <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" minlength="4" maxlength="1024" required>
        </div>
        <div class="form-group">
          <label for="newPassword">Nova senha</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="4" maxlength="1024" required>
          <small>Pelo menos 4 caracteres.</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirme a nova senha</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="4" maxlength="1024" required>
        </div>
        <p id="passwordError" class="alert alert-error" role="alert" hidden></p>
        <p id="passwordSuccess" class="alert alert-success" role="status" hidden></p>
        <button id="savePassword" class="btn btn-primary btn-full btn-auth" type="submit">Salvar nova senha</button>
      </form>
      <button id="passwordLogout" class="btn btn-outline btn-full" type="button">Sair da conta</button>
    </section>
  </main>
  <script src="/js/force-password.js?v=20261014a" defer></script>
  <script src="/js/cyber.js?v=20261014a"></script>
  <script src="/js/auth-flow.js?v=20261014a"></script>
  <script src="/js/cursor.js?v=20261014a"></script>
  <script src="/js/announce.js?v=20261014a"></script>
  <div id="gfxModal" class="modal" style="display:none;" aria-hidden="true">
    <div class="modal-overlay" data-gfx-close></div>
    <div class="modal-content gfx-modal-card" role="dialog" aria-modal="true" aria-labelledby="gfxModalTitle">
      <div class="modal-header"><h3 id="gfxModalTitle"><i class="fas fa-cog"></i> Gráficos e desempenho</h3><button class="modal-close" type="button" data-gfx-close aria-label="Fechar">&times;</button></div>
      <div class="modal-body">
        <p class="text-muted" style="font-size:13px;margin-bottom:12px;">Escolha o nível de efeitos. Quanto mais baixo, mais leve e rápido o site fica.</p>
        <div class="gfx-options">
          <button class="gfx-option" type="button" data-gfx-option="high" aria-pressed="true"><i class="fas fa-wand-magic-sparkles"></i><span><strong>Alto — tudo ligado</strong><small>Partículas, brilhos e animações completas. Para aparelhos fortes.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="medium" aria-pressed="false"><i class="fas fa-gauge-high"></i><span><strong>Médio — equilibrado</strong><small>Menos brilhos, partículas suaves. Bom para a maioria.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="low" aria-pressed="false"><i class="fas fa-feather"></i><span><strong>Baixo — bem leve</strong><small>Sem efeitos nem animações. Ideal para celular simples ou internet lenta.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="basic" aria-pressed="false"><i class="fas fa-battery-quarter"></i><span><strong>Básico — muito leve</strong><small>Sem efeitos, animações nem transições. Para aparelhos simples.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="minimal" aria-pressed="false"><i class="fas fa-battery-empty"></i><span><strong>Mínimo — ultra leve</strong><small>Absoluto mínimo: sem efeitos, sombras nem gradientes. Para aparelhos muito fracos.</small></span></button>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" type="button" data-gfx-close><i class="fas fa-check"></i> Pronto</button></div>
    </div>
  </div>
</body>
</html>
