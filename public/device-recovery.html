<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Recuperar dispositivo principal — Arquive Online</title>
  <link rel="stylesheet" href="/css/style.css?v=20261014c">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:20px; background:#080b12; color:#e8f1ff; font-family:Inter,system-ui,sans-serif; }
    main { width:min(100%,520px); padding:28px; border:1px solid #263247; border-radius:18px; background:#111827; }
    h1 { font-size:1.45rem; } p { line-height:1.6; color:#aab7cc; }
    label { display:block; margin:18px 0 8px; } input { width:100%; padding:12px; border-radius:9px; }
    button { margin-top:16px; } #recoveryStatus { min-height:1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Recuperar dispositivo principal</h1>
    <p>Este link é de uso único e expira em 15 minutos. A recuperação encerra o acesso dos outros aparelhos e torna este aparelho o principal. Abra-o no mesmo aparelho em que iniciou a solicitação.</p>
    <form id="recoveryForm">
      <label for="recoveryPassword">Senha atual da conta</label>
      <input id="recoveryPassword" type="password" autocomplete="current-password" minlength="4" maxlength="1024" required>
      <button id="recoverySubmit" class="btn btn-primary" type="submit">Confirmar recuperação</button>
    </form>
    <p id="recoveryStatus" role="status" aria-live="polite"></p>
    <a href="/">Voltar ao login</a>
  </main>
  <script>
    const form = document.getElementById('recoveryForm');
    const status = document.getElementById('recoveryStatus');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('recoverySubmit');
      button.disabled = true;
      status.textContent = 'Validando e recuperando o dispositivo…';
      try {
        const token = new URLSearchParams(location.search).get('token') || '';
        const response = await fetch('/api/devices/recovery/claim', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: document.getElementById('recoveryPassword').value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Não foi possível recuperar o dispositivo.');
        status.textContent = data.message || 'Dispositivo recuperado. Faça login novamente.';
        history.replaceState(null, '', '/device-recovery');
        setTimeout(() => { location.href = '/'; }, 2500);
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
