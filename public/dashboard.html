<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0612">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FileShare - Salas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/social.css">
  <script src="/js/common.js"></script>
  <style>
    .dashboard-content { max-width: 1180px; margin: 0 auto; padding: 32px; }
    .dashboard-intro { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:24px; }
    .dashboard-intro h2 { color:var(--gray-900); margin-bottom:4px; }
    .dashboard-intro p { color:var(--gray-500); }
    .rooms-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:20px; }
    .room-card { display:flex; flex-direction:column; min-height:220px; }
    .room-card-body { flex:1; }
    .room-card h3 { margin-bottom:6px; color:var(--gray-900); }
    .room-description { color:var(--gray-500); min-height:48px; }
    .room-meta { display:flex; gap:16px; color:var(--gray-500); font-size:13px; margin:18px 0; }
    .room-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .empty-state { text-align:center; padding:52px 20px; color:var(--gray-500); }
    .empty-state i { font-size:42px; margin-bottom:12px; color:var(--gray-300); }
    .profile-pill { display:flex; align-items:center; gap:8px; color:var(--gray-700); font-size:14px; }
    .avatar { flex:none; }
    .modal-content { max-width:720px; }
    @media (max-width:640px) {
      .dashboard-content { padding:20px 14px; }
      .dashboard-intro { align-items:flex-start; flex-direction:column; }
      .header { padding:14px 16px; }
      .header-left h1 { font-size:18px; }
      .header-right .profile-pill { display:none; }
      .room-actions .btn { flex:1 1 100%; justify-content:center; }
      .modal { padding:10px; align-items:flex-end; }
      .modal-content { width:100%; max-width:100%; max-height:92vh; overflow:hidden; border-radius:18px 18px 0 0; }
      .modal-body { max-height:calc(92vh - 70px); overflow-y:auto; padding:0 16px 18px; }
      .file-row { align-items:flex-start; min-width:0; }
      .file-row-name { white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
      .file-row .btn { flex:0 0 auto; }
      .form-row { display:grid; grid-template-columns:1fr auto; gap:8px; }
      .form-row input { min-width:0; width:100%; }
      .form-row .btn { width:auto; }
    }
  </style>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/js/mobile.js" defer></script>
  <link rel="stylesheet" href="/css/fx.css">
  <link rel="stylesheet" href="/css/adaptive.css">
  <script src="/js/fx.js" defer></script>
</head>
<body class="app-page">
  <header class="header">
    <div class="header-left"><i class="fas fa-share-alt header-logo"></i><h1>FileShare</h1><span class="badge">Salas</span></div>
    <div class="header-right">
      <span class="profile-pill"><span class="avatar" id="userAvatar"></span><span id="userName">Carregando...</span></span>
      <button class="btn btn-sm btn-outline" onclick="showPasswordModal()" title="Alterar senha"><i class="fas fa-key"></i></button>
      <button class="btn btn-sm btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="dashboard-intro">
      <div><h2><i class="fas fa-door-open"></i> Suas salas</h2><p>Entre em uma sala para compartilhar e encontrar arquivos.</p></div>
      <div class="intro-actions"><button id="newRoomBtn" class="btn btn-green" onclick="showCreateRoom()"><i class="fas fa-plus"></i> Sala temporária</button><button class="btn btn-outline" onclick="loadRooms()"><i class="fas fa-sync-alt"></i> Atualizar</button></div>
    </div>
    <div id="roomsGrid" class="rooms-grid"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando salas...</div></div>
  </main>

  <div id="roomModal" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="closeRoom()"></div>
    <div class="modal-content modal-lg drop-target">
      <div class="drop-veil"><i class="fas fa-cloud-arrow-up"></i><span>Solte para enviar à sala</span></div>
      <div class="modal-header"><h3 id="roomModalTitle">Sala</h3><div class="room-head-btns"><button id="leaveRoomBtn" class="btn btn-sm btn-outline btn-danger" onclick="leaveCurrentRoom()" title="Sair da sala"><i class="fas fa-sign-out-alt"></i> Sair da sala</button><button class="btn btn-sm btn-outline" onclick="closeRoom()" title="Fechar (Esc)"><i class="fas fa-arrow-left"></i> Voltar</button><button class="modal-close" onclick="closeRoom()" title="Fechar">&times;</button></div></div>
      <div class="modal-body">
        <form id="uploadForm">
          <label class="dropzone" for="fileInput">
            <i class="fas fa-cloud-arrow-up dz-icon"></i>
            <span class="dz-title"><span class="drop-hint-desktop">Arraste os arquivos aqui ou <u>clique para escolher</u></span><u class="touch-only">Toque para escolher os arquivos</u></span>
            <span class="dz-limit"><i class="fas fa-triangle-exclamation"></i> Limite de <b class="limit-note">…</b> por arquivo · <i class="fas fa-paste"></i> Ctrl+V cola imagem</span>
            <span class="dz-progress" id="uploadBar" style="display:none;"><span class="dz-bar" id="uploadBarFill"></span></span>
            <span id="uploadStatus" class="dz-status"></span>
            <input id="fileInput" type="file" multiple hidden>
          </label>
        </form>
        <div class="section-title"><i class="fas fa-folder-open"></i> Arquivos <span id="fileCount" class="section-count"></span></div>
        <div id="roomFiles" class="file-list"></div>
        <div class="section-title"><i class="fas fa-comments"></i> Chat da sala</div>
        <div class="chat-box">
          <div id="chatList" class="chat-list"></div>
          <form id="messageForm" class="chat-compose" autocomplete="off">
            <input id="messageInput" type="text" placeholder="Escreva uma mensagem..." maxlength="1000" required>
            <button class="btn btn-primary chat-send" type="submit" title="Enviar"><i class="fas fa-paper-plane"></i></button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="createRoomModal" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="closeCreateRoom()"></div>
    <div class="modal-content"><div class="modal-header"><h3><i class="fas fa-hourglass-half"></i> Nova sala temporária</h3><button class="modal-close" onclick="closeCreateRoom()">&times;</button></div>
      <div class="modal-body">
        <div class="form-group"><label>Nome da sala</label><input id="newRoomName" type="text" maxlength="60" placeholder="Ex.: Fotos da viagem"></div>
        <div class="form-group"><label>Duração</label><div class="duration-pick" id="durationPick"><button type="button" data-m="5" class="active">5 min</button><button type="button" data-m="10">10 min</button><button type="button" data-m="30">30 min</button></div></div>
        <p class="text-muted" style="font-size:13px"><i class="fas fa-globe"></i> A sala é pública e é apagada sozinha (com arquivos e chat) quando o tempo acabar.</p>
      </div>
      <div class="modal-footer"><button class="btn btn-green" onclick="createTempRoom()">Criar sala</button></div></div>
  </div>
  <div id="passwordModal" class="modal" style="display:none;">
    <div class="modal-overlay" onclick="closePasswordModal()"></div>
    <div class="modal-content"><div class="modal-header"><h3>Alterar senha</h3><button class="modal-close" onclick="closePasswordModal()">&times;</button></div><div class="modal-body"><div class="form-group"><label>Senha atual</label><input id="currentPassword" type="password" required></div><div class="form-group"><label>Nova senha</label><input id="newPassword" type="password" required minlength="4"></div></div><div class="modal-footer"><button class="btn btn-primary" onclick="changePassword()">Salvar</button></div></div>
  </div>
  <div id="toastContainer" class="toast-container"></div>

  <script src="/js/upload.js"></script>
  <script>
    const MAX_UPLOAD = 4 * 1024 * 1024; // limite de requisição da Vercel (~4,5 MB)
    let currentRoom = null, me = null;
    let lastRoomsSig = '', lastFilesSig = '', lastChatSig = '';
    const esc = value => { const div = document.createElement('div'); div.textContent = value; return div.innerHTML; };
    const formatSize = bytes => { if (!bytes) return '0 B'; const units = ['B','KB','MB','GB']; const i = Math.floor(Math.log(bytes) / Math.log(1024)); return `${(bytes / 1024 ** i).toFixed(i ? 1 : 0)} ${units[i]}`; };
    function toast(message, type='success') { const item = document.createElement('div'); item.className = `toast toast-${type} show`; item.textContent = message; document.getElementById('toastContainer').appendChild(item); setTimeout(() => item.remove(), type === 'error' ? 7000 : 3000); }
    async function api(url, options) { const response = await fetch(url, options); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || 'Não foi possível concluir a operação'); return data; }
    async function loadUser() { try { const user = await api('/api/me'); me = user; document.getElementById('userName').textContent = user.username; const avatar = document.getElementById('userAvatar'); avatar.textContent = user.username[0].toUpperCase(); avatar.style.background = user.avatar_color; if (user.role === 'admin') { const b = document.getElementById('newRoomBtn'); if (b) b.style.display = 'none'; } } catch (error) { window.location.href = '/'; } }
    async function loadRooms() { const grid = document.getElementById('roomsGrid'); try { const rooms = await api('/api/rooms'); const sig = JSON.stringify(rooms); if (sig === lastRoomsSig) return; lastRoomsSig = sig; window.roomsById = Object.fromEntries(rooms.map(r => [r.id, r])); if (!rooms.length) { grid.innerHTML = '<div class="empty-state"><i class="fas fa-door-open"></i><h3>Nenhuma sala disponível</h3><p>O administrador ainda não criou uma sala para você.</p></div>'; return; } grid.innerHTML = rooms.map(room => `<article class="card room-card"><div class="room-card-body"><div class="room-card-header"><i class="fas fa-folder-open"></i><span class="badge ${room.is_public ? 'badge-green' : 'badge-yellow'}">${room.is_public ? 'Pública' : '<i class=\"fas fa-lock\"></i> Privada'}</span>${room.is_owner && !room.is_public ? '<span class=\"badge badge-blue\"><i class=\"fas fa-crown\"></i> Dono</span>' : ''}${room.expires_at ? `<span class="badge badge-yellow room-exp" data-exp="${esc(room.expires_at)}"><i class="fas fa-hourglass-half"></i> <span></span></span>` : ''}</div><h3>${esc(room.name)}</h3><p class="room-description">${esc(room.description || 'Sem descrição')}</p><div class="room-meta"><span><i class="fas fa-file"></i> ${room.fileCount} arquivo(s)</span><span><i class="fas fa-users"></i> ${room.memberCount}</span></div></div><div class="room-actions">${room.isMember ? `<button class="btn btn-primary" onclick="openRoom('${room.id}', '${esc(room.name)}')"><i class="fas fa-folder-open"></i> Abrir</button><button class="btn btn-outline btn-danger" onclick="leaveRoom('${room.id}')"><i class="fas fa-sign-out-alt"></i> Sair</button>` : `<button class="btn btn-primary" onclick="joinRoom('${room.id}')"><i class="fas fa-door-open"></i> Entrar na sala</button>`}<a class="btn btn-outline" href="/sala/${encodeURIComponent(room.slug)}" target="_blank"><i class="fas fa-link"></i> Link público</a></div></article>`).join(''); } catch (error) { grid.innerHTML = `<div class="alert alert-error">${esc(error.message)}</div>`; } }
    async function joinRoom(id) { try { await api(`/api/rooms/${id}/join`, { method:'POST' }); toast('Você entrou na sala'); loadRooms(); } catch (error) { toast(error.message, 'error'); } }
    async function leaveRoom(id) { if (!confirm('Sair desta sala?')) return; try { await api(`/api/rooms/${id}/leave`, { method:'POST' }); toast('Você saiu da sala'); loadRooms(); } catch (error) { toast(error.message, 'error'); } }
    async function openRoom(id, name) { currentRoom = id; lastFilesSig = ''; lastChatSig = ''; document.getElementById('roomModalTitle').textContent = name; document.getElementById('roomModal').style.display = 'flex'; const lb = document.getElementById('leaveRoomBtn'); if (lb) lb.style.display = (me && me.role === 'admin') ? 'none' : ''; try { await Promise.all([loadFiles(), loadMessages()]); } catch (error) { toast(error.message, 'error'); } }
    async function leaveCurrentRoom() { if (!currentRoom) return; if (!confirm('Sair desta sala?')) return; try { await api(`/api/rooms/${currentRoom}/leave`, { method:'POST' }); toast('Você saiu da sala'); closeRoom(); loadRooms(); } catch (error) { toast(error.message, 'error'); } }
    document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (document.querySelector('.rename-modal')) return; ['createRoomModal','passwordModal'].forEach(id => { const m = document.getElementById(id); if (m && m.style.display !== 'none') m.style.display = 'none'; }); if (currentRoom) closeRoom(); });
    function closeRoom() { currentRoom = null; lastRoomsSig = ''; document.getElementById('roomModal').style.display = 'none'; }
    async function loadFiles() { const rooms = await api('/api/rooms'); const room = rooms.find(item => item.id === currentRoom); if (!room) { toast('Esta sala expirou ou foi removida', 'error'); closeRoom(); loadRooms(); return; } const sig = JSON.stringify(room.files) + Math.floor(Date.now() / 30000); if (sig === lastFilesSig) return; lastFilesSig = sig; document.getElementById('fileCount').textContent = '(' + room.files.length + ')'; const list = document.getElementById('roomFiles'); list.innerHTML = room.files.length ? room.files.map(file => `<div class="file-row"><div class="file-main">${uploaderTag(file.uploader, file.uploader_role)}<span class="file-row-name"><i class="fas fa-file"></i> ${esc(file.original_name)}</span><span class="file-meta-line">${kindBadge(file.original_name, file.mime_type)}<span class="text-muted">${formatSize(file.size)}</span>${timeAgo(file.uploaded_at)}</span></div><div class="file-btns">${file.can_edit ? `<button class="btn btn-sm btn-outline" title="Renomear" onclick="renameFile('${file.id}', this.dataset.name, () => { lastFilesSig = ''; lastRoomsSig = ''; loadFiles(); loadRooms(); })" data-name="${esc(file.original_name)}"><i class="fas fa-pen"></i></button>` : ''}${file.can_delete ? `<button class="btn btn-sm btn-outline btn-danger" title="Excluir" onclick="deleteFile('${file.id}')"><i class="fas fa-trash"></i></button>` : ''}<a class="btn btn-sm btn-green" title="Baixar" href="/download/${file.id}"><i class="fas fa-download"></i> Baixar</a></div></div>`).join('') : '<div class="empty-state"><i class="fas fa-inbox"></i><p>Nenhum arquivo nesta sala.</p></div>'; }
    async function deleteFile(id) { if (!confirm('Excluir este arquivo?')) return; try { await api('/api/files/' + id, { method:'DELETE' }); toast('Arquivo excluído'); lastFilesSig = ''; lastRoomsSig = ''; loadFiles(); loadRooms(); } catch (error) { toast(error.message, 'error'); } }
    let newRoomMinutes = 5;
    function showCreateRoom() { document.getElementById('createRoomModal').style.display = 'flex'; document.getElementById('newRoomName').focus(); }
    function closeCreateRoom() { document.getElementById('createRoomModal').style.display = 'none'; }
    document.getElementById('durationPick').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (!b) return; newRoomMinutes = Number(b.dataset.m); document.querySelectorAll('#durationPick button').forEach(x => x.classList.toggle('active', x === b)); });
    async function createTempRoom() { const name = document.getElementById('newRoomName').value.trim(); if (!name) { toast('Dê um nome para a sala', 'error'); return; } try { const room = await api('/api/rooms', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name, duration_minutes:newRoomMinutes }) }); document.getElementById('newRoomName').value = ''; closeCreateRoom(); toast('Sala criada! Ela some em ' + newRoomMinutes + ' min'); lastRoomsSig = ''; await loadRooms(); openRoom(room.id, room.name); } catch (error) { toast(error.message, 'error'); } }
    function tickExpiry() { document.querySelectorAll('.room-exp').forEach(el => { const left = new Date(el.dataset.exp.replace(' ', 'T') + 'Z') - Date.now(); el.lastElementChild.textContent = left > 0 ? 'expira em ' + Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0') : 'expirando...'; }); }
    setInterval(tickExpiry, 1000);
    enablePaste(files => { if (currentRoom && document.getElementById('roomModal').style.display !== 'none') sendFiles(files); });
    const chatTime = value => { const d = new Date(String(value).replace(' ', 'T') + 'Z'); const hm = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); return d.toDateString() === new Date().toDateString() ? hm : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ' ' + hm; };
    async function loadMessages(forceBottom = false) {
      const messages = await api(`/api/rooms/${currentRoom}/messages`);
      const sig = JSON.stringify(messages); if (sig === lastChatSig) return;
      const first = lastChatSig === ''; lastChatSig = sig;
      const box = document.getElementById('chatList');
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      let prev = null;
      box.innerHTML = messages.length ? messages.map(m => {
        const mine = me && m.user_id === me.id;
        const cont = prev && prev.user_id === m.user_id; prev = m;
        return `<div class="msg ${mine ? 'me' : ''} ${cont ? 'cont' : ''}"><span class="msg-avatar ${m.role === 'admin' ? 'is-admin' : ''}" style="background:${esc(m.avatar_color || '#8b5cf6')}">${esc(m.username[0].toUpperCase())}</span><div class="msg-bubble">${cont ? '' : `<div class="msg-meta ${m.role === 'admin' ? 'is-admin' : ''}"><b>${mine ? 'você' : esc(m.username)}</b>${admBadge(m.role)}<time>${chatTime(m.created_at)}</time></div>`}<div class="msg-text">${linkify(m.content)}</div></div></div>`;
      }).join('') : '<div class="chat-empty"><i class="fas fa-satellite-dish"></i><span>Canal vazio. Mande a primeira mensagem.</span></div>';
      if (first || forceBottom || atBottom) box.scrollTop = box.scrollHeight;
    }
    async function sendFiles(list) {
      const files = Array.from(list);
      if (!files.length || !currentRoom) return;
      const status = document.getElementById('uploadStatus'), bar = document.getElementById('uploadBar'), fill = document.getElementById('uploadBarFill');
      bar.style.display = 'block'; fill.style.width = '0%';
      try {
        const result = await uploadToRoom(currentRoom, files, text => { status.textContent = text; const m = text.match(/(\d+)%$/); if (m) fill.style.width = m[1] + '%'; });
        const warn = skippedMessage(result);
        if (result.sent) toast(result.sent === 1 ? 'Arquivo enviado' : result.sent + ' arquivos enviados');
        if (warn) toast(warn, 'error');
        status.textContent = result.sent ? 'Envio concluído' : '';
        fill.style.width = result.sent ? '100%' : '0%';
        loadFiles(); loadRooms();
      } catch (error) { status.textContent = ''; toast(error.message, 'error'); }
      setTimeout(() => { if (!/Enviando/.test(status.textContent)) { bar.style.display = 'none'; status.textContent = ''; } }, 2500);
    }
    document.getElementById('uploadForm').addEventListener('submit', event => event.preventDefault());
    document.getElementById('fileInput').addEventListener('change', event => { const files = Array.from(event.target.files); event.target.value = ''; sendFiles(files); });
    enableDrop(document.getElementById('roomModal'), '.drop-target', (el, files) => sendFiles(files));
    document.getElementById('messageForm').addEventListener('submit', async event => { event.preventDefault(); const input = document.getElementById('messageInput'); try { await api(`/api/rooms/${currentRoom}/messages`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:input.value}) }); input.value = ''; loadMessages(true); } catch (error) { toast(error.message, 'error'); } });
    function showPasswordModal() { document.getElementById('passwordModal').style.display = 'flex'; }
    function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; }
    async function changePassword() { try { await api('/api/change-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ currentPassword:document.getElementById('currentPassword').value, newPassword:document.getElementById('newPassword').value }) }); closePasswordModal(); toast('Senha alterada'); } catch (error) { toast(error.message, 'error'); } }
    async function logout() { await fetch('/api/logout', { method:'POST' }); window.location.href = '/'; }
    document.querySelector('.btn-danger').addEventListener('click', logout);
    loadUser(); loadRooms(); fillLimitNotes();

    // Atualização automática a cada 2 s (sem recarregar a página, para não atrapalhar quem está digitando)
    let refreshing = false;
    async function autoRefresh() {
      if (document.hidden || refreshing) return;
      refreshing = true;
      try {
        if (currentRoom) await Promise.all([loadFiles(), loadMessages()]);
        else await loadRooms();
      } catch (error) { /* tenta de novo no próximo ciclo */ }
      finally { refreshing = false; }
    }
    setInterval(autoRefresh, 2000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRefresh(); });
  </script>
  <script src="/js/social.js"></script>
  <script src="/js/cursor.js"></script>
  <script src="/js/announce.js"></script>
</body>
</html>
