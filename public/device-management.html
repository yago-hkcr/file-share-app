<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Dispositivos vinculados — Arquive Online</title>
  <link rel="stylesheet" href="/css/style.css?v=20261014c">
  <style>
    body { min-height:100vh; padding:24px; background:#080b12; color:#e8f1ff; font-family:Inter,system-ui,sans-serif; }
    main { width:min(100%,860px); margin:24px auto; padding:26px; border:1px solid #263247; border-radius:18px; background:#111827; }
    header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    h1 { font-size:1.5rem; } p { line-height:1.55; color:#aab7cc; }
    .device-list { display:grid; gap:12px; margin:24px 0; }
    .device { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; padding:14px; border:1px solid #263247; border-radius:12px; background:#0c1220; }
    .device-copy { display:grid; gap:5px; } .device-copy small { color:#94a3b8; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .state { min-height:1.5em; } [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Dispositivos vinculados</h1><p>Aprove, recuse e encerre os acessos da conta. Cada ação exige sua senha atual.</p></div><a class="btn btn-outline" href="/admin">Voltar ao painel ADM</a></header>
    <p id="deviceState" class="state" role="status" aria-live="polite">Carregando dispositivos…</p>
    <section id="deviceList" class="device-list"></section>
  </main>
  <script>
    const list = document.getElementById('deviceList');
    const state = document.getElementById('deviceState');
    const esc = value => { const node = document.createElement('span'); node.textContent = value == null ? '' : String(value); return node.innerHTML; };
    const humanTime = value => value ? new Date(String(value).replace(' ', 'T') + 'Z').toLocaleString('pt-BR') : '—';
    async function api(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Não foi possível concluir a operação.');
      return data;
    }
    async function load() {
      state.textContent = 'Carregando dispositivos…';
      try {
        const result = await api('/api/devices');
        list.innerHTML = result.devices.map(device => {
          const label = device.is_primary ? 'Principal' : device.status === 'pending' ? 'Aguardando aprovação' : 'Aprovado';
          let actions = '<small>Este aparelho</small>';
          if (!device.is_current && device.status === 'pending') actions = '<button class="btn btn-primary btn-sm" data-action="approve" data-id="' + esc(device.id) + '">Aprovar</button><button class="btn btn-outline btn-sm" data-action="deny" data-id="' + esc(device.id) + '">Recusar</button>';
          else if (!device.is_current && device.status === 'approved') actions = '<button class="btn btn-outline btn-sm" data-action="primary" data-id="' + esc(device.id) + '">Tornar principal</button><button class="btn btn-outline btn-danger btn-sm" data-action="revoke" data-id="' + esc(device.id) + '">Encerrar</button>';
          return '<article class="device"><div class="device-copy"><strong>' + esc(device.name) + '</strong><small>' + label + ' · Último acesso: ' + esc(humanTime(device.last_seen)) + '</small></div><div class="actions">' + actions + '</div></article>';
        }).join('') || '<p>Nenhum dispositivo cadastrado.</p>';
        state.textContent = 'Apenas este dispositivo principal pode gerenciar a lista.';
        list.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', async () => {
          const action = button.dataset.action;
          if (!confirm('Confirma esta ação?')) return;
          const confirmationPassword = prompt('Digite a senha atual para confirmar:');
          if (confirmationPassword === null) return;
          try {
            const options = { method: action === 'revoke' ? 'DELETE' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirmationPassword }) };
            const url = '/api/devices/' + encodeURIComponent(button.dataset.id) + (action === 'revoke' ? '' : '/' + action);
            await api(url, options);
            await load();
          } catch (error) { state.textContent = error.message; }
        }));
      } catch (error) { state.textContent = error.message; }
    }
    load();
  </script>
</body>
</html>
