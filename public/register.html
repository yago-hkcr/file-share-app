<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0612">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FileShare - Criar Conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261008d">
  <script src="/js/common.js?v=20261007a"></script>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/js/mobile.js" defer></script>
  <link rel="stylesheet" href="/css/fx.css">
  <link rel="stylesheet" href="/css/adaptive.css">
  <script src="/js/fx.js" defer></script>
<link rel="stylesheet" href="/css/mobile-scroll-fix.css?v=20261010b">`n</head>
<body class="auth-page">
  <canvas id="cyberRain" aria-hidden="true"></canvas>
  <div class="cy-grid" aria-hidden="true"></div>
  <div class="cy-scan" aria-hidden="true"></div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-share-alt"></i></div>
        <h1 class="glitch" data-text="CRIAR CONTA">CRIAR CONTA</h1>
        <p class="cy-status"><span id="cyType" data-text="> solicitar acesso ao sistema"></span><span class="cy-caret"></span></p>
        <button type="button" class="btn btn-sm btn-outline auth-settings-btn" id="authSettingsBtn" aria-label="Configurações de desempenho" title="Configurações de desempenho"><i class="fas fa-cog" aria-hidden="true"></i></button>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Nome de Usuário</label>
          <input type="text" id="username" placeholder="Escolha um nome de usuário" required minlength="3">
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="Seu email" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Senha</label>
          <input type="password" id="password" placeholder="Mínimo de 4 caracteres" required minlength="4" maxlength="1024" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Confirmar Senha</label>
          <input type="password" id="password2" placeholder="Repita a senha" required minlength="4" maxlength="1024" autocomplete="new-password">
        </div>
        <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
        <div id="successMsg" class="alert alert-success" style="display:none;"></div>
        <button type="submit" class="btn btn-success btn-full"><i class="fas fa-user-plus"></i> CRIAR CONTA</button>
        <p id="registerHint" style="color:#c9bfe0;font-size:13px;text-align:center;margin:12px 0 0;" hidden></p>
      </form>
      <div class="auth-footer">
        <p>Já tem conta? <a href="/">Entrar</a></p>
      </div>
    </div>
  </div>
  <div id="gfxModal" class="modal" style="display:none;" aria-hidden="true">
    <div class="modal-overlay" data-gfx-close></div>
    <div class="modal-content gfx-modal-card" role="dialog" aria-modal="true" aria-labelledby="gfxModalTitle">
      <div class="modal-header"><h3 id="gfxModalTitle"><i class="fas fa-cog"></i> Gráficos e desempenho</h3><button class="modal-close" type="button" data-gfx-close aria-label="Fechar">&times;</button></div>
      <div class="modal-body">
        <p class="text-muted" style="font-size:13px;margin-bottom:12px;">Escolha o nível de efeitos. Quanto mais baixo, mais leve e rápido o site fica.</p>
        <div class="gfx-options">
          <button class="gfx-option" type="button" data-gfx-option="high" aria-pressed="true"><i class="fas fa-wand-magic-sparkles"></i><span><strong>Alto — tudo ligado</strong><small>Partículas, brilhos e animações completas. Para aparelhos fortes.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="medium" aria-pressed="false"><i class="fas fa-gauge-high"></i><span><strong>Médio — equilibrado</strong><small>Menos brilhos, partículas suaves. Bom para a maioria.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="low" aria-pressed="false"><i class="fas fa-feather"></i><span><strong>Baixo — bem leve</strong><small>Sem efeitos nem animações. Ideal para celular simples ou internet lenta.</small></span></button>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" type="button" data-gfx-close><i class="fas fa-check"></i> Pronto</button></div>
    </div>
  </div>
  <script src="/js/gfx.js?v=20261009a"></script>
  <script src="/js/cyber.js"></script>
  <script>
    // Mostra o aviso certo sobre o fluxo de cadastro (aprovação, automático ou fechado).
    fetch('/api/public/registration').then(r => r.json()).then(data => {
      const hint = document.getElementById('registerHint');
      if (!hint || !data.mode || data.mode === 'auto') return;
      hint.textContent = data.mode === 'closed'
        ? 'Os cadastros estão fechados no momento. Peça acesso ao administrador.'
        : 'Após o cadastro, o administrador precisa aprovar seu acesso antes do primeiro login.';
      hint.hidden = false;
    }).catch(() => {});
  </script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      const suc = document.getElementById('successMsg');
      err.style.display = 'none'; suc.style.display = 'none';

      const password = document.getElementById('password').value;
      if (password !== document.getElementById('password2').value) {
        err.textContent = 'As senhas não coincidem';
        err.style.display = 'block'; return;
      }
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password
          })
        });
        const data = await res.json();
        if (res.ok) {
          suc.innerHTML = '<i class="fas fa-check-circle"></i> ' + data.message;
          suc.style.display = 'block';
          document.getElementById('registerForm').reset();
          setTimeout(() => window.location.href = '/', 3000);
        } else {
          err.textContent = data.error;
          err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = 'Erro de conexão';
        err.style.display = 'block';
      }
    });
  </script>
  <script src="/js/cursor.js"></script>
  <script src="/js/announce.js"></script>
</body>
</html>
