<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0612">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FileShare - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261008d"><link rel="stylesheet" href="/css/login-intro.css?v=20261007a">
  <script src="/js/common.js?v=20261007a"></script>
  <link rel="stylesheet" href="/css/mobile.css">
  <script src="/js/mobile.js" defer></script>
  <link rel="stylesheet" href="/css/fx.css">
  <link rel="stylesheet" href="/css/adaptive.css">
  <script src="/js/fx.js" defer></script>
<link rel="stylesheet" href="/css/mobile-scroll-fix.css?v=20261010b">`n</head>
<body class="auth-page">
  <canvas id="cyberRain" aria-hidden="true"></canvas>
  <div class="cy-grid" aria-hidden="true"></div>
  <div class="cy-scan" aria-hidden="true"></div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-share-alt"></i></div>
        <h1 class="glitch" data-text="FILESHARE">FILESHARE</h1>
        <p class="cy-lead" style="margin:0 0 10px;font-size:14px;text-align:center;">Compartilhe arquivos em salas, peça envios com Coletas e organize tudo no seu Acervo.</p>
        <p class="cy-status"><span id="cyType" data-text="> conexão segura estabelecida"></span><span class="cy-caret"></span></p>
        <button type="button" class="btn btn-sm btn-outline auth-settings-btn" id="authSettingsBtn" aria-label="Configurações de desempenho" title="Configurações de desempenho"><i class="fas fa-cog" aria-hidden="true"></i></button>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Usuário ou Email</label>
          <input type="text" id="username" placeholder="usuário ou email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Senha</label>
          <input type="password" id="password" placeholder="sua senha" autocomplete="current-password" maxlength="1024" required>
        </div>
        <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full"><i class="fas fa-sign-in-alt"></i> ENTRAR</button>
      </form>
      <div class="auth-footer">
        <p>Não tem conta? <a href="/register">Criar conta</a></p>
      </div>
    </div>
  </div>
  <div id="gfxModal" class="modal" style="display:none;" aria-hidden="true">
    <div class="modal-overlay" data-gfx-close></div>
    <div class="modal-content gfx-modal-card" role="dialog" aria-modal="true" aria-labelledby="gfxModalTitle">
      <div class="modal-header"><h3 id="gfxModalTitle"><i class="fas fa-cog"></i> Gráficos e desempenho</h3><button class="modal-close" type="button" data-gfx-close aria-label="Fechar">&times;</button></div>
      <div class="modal-body">
        <p class="text-muted" style="font-size:13px;margin-bottom:12px;">Escolha o nível de efeitos. Quanto mais baixo, mais leve e rápido o site fica.</p>
        <div class="gfx-options">
          <button class="gfx-option" type="button" data-gfx-option="high" aria-pressed="true"><i class="fas fa-wand-magic-sparkles"></i><span><strong>Alto — tudo ligado</strong><small>Partículas, brilhos e animações completas. Para aparelhos fortes.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="medium" aria-pressed="false"><i class="fas fa-gauge-high"></i><span><strong>Médio — equilibrado</strong><small>Menos brilhos, partículas suaves. Bom para a maioria.</small></span></button>
          <button class="gfx-option" type="button" data-gfx-option="low" aria-pressed="false"><i class="fas fa-feather"></i><span><strong>Baixo — bem leve</strong><small>Sem efeitos nem animações. Ideal para celular simples ou internet lenta.</small></span></button>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary" type="button" data-gfx-close><i class="fas fa-check"></i> Pronto</button></div>
    </div>
  </div>
  <script src="/js/gfx.js?v=20261009a"></script>
  <script src="/js/cyber.js"></script><script src="/js/login-intro.js?v=20261007a"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.password_change_required ? '/change-password' : data.role === 'admin' ? '/admin' : '/dashboard';
        } else {
          err.textContent = data.error;
          err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = 'Erro de conexão';
        err.style.display = 'block';
      }
    });
  </script>
  <script src="/js/cursor.js"></script>
  <script src="/js/announce.js"></script>
</body>
</html>
