services:
  - type: web
    name: arquive
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    # Free tier: 750 hours/month. Sleeps after ~15 min idle;
    # .github/workflows/keepalive.yml pings every 5 min to prevent sleeping.
    envVars:
      - key: NODE_ENV
        value: production
      - key: IS_HOSTED
        value: "1"
      - key: STORAGE_PROVIDER
        value: blob
      - key: APP_BASE_URL
        value: https://www.arquive.online
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: SUPABASE_CA_CERT_B64
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      # Para migrar do Blob para Cloudflare R2/S3 no futuro:
      # 1. troque STORAGE_PROVIDER para s3;
      # 2. descomente as variáveis abaixo;
      # 3. aplique deploy/r2-cors.json no bucket.
      # - key: S3_FORCE_PATH_STYLE
      #   value: "true"
      # - key: S3_REGION
      #   sync: false
      # - key: S3_ENDPOINT
      #   sync: false
      # - key: S3_BUCKET
      #   sync: false
      # - key: S3_ACCESS_KEY_ID
      #   sync: false
      # - key: S3_SECRET_ACCESS_KEY
      #   sync: false
